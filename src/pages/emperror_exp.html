<!DOCTYPE html>
<html>

<head>
    <title> off beat: rate charts </title>
    <link rel="stylesheet" href="../style/css/global.css">
    <link rel="stylesheet" href="../style/css/review_page.css">
</head>
<body>
     <div class="parent">
            <header>
                <div class="header_left">
                    <button onclick="window.location.href='../index.html'" style="margin:10px;" class = "back">← Back</button>
                    <div class="header_text">
                    <h1>Off Beat: Rhythm Rating Dashboard</h1>
                    <p>Rate and track your favorite rhythm game songs</p>
                    </div>
                </div>
                <a href = "signup.html">
                    <img class="icon" src="../style/assets/icons/pfp_placeholder.png"> 
                </a>
            </header>

            <div class="chart_card">
                <div class="jacket_holder">
                    <img src="../style/assets/placeholders/emperror.png">
                </div>
                <div class="chart_info">
                    <p class="title"> the EmpErroR </p>
                    <p> sasakure.uk</p>
                    <p> Charter: すきやき奉行 </p>
                    <div> 
                        <span class="level_diff exp"> 13.4 </span>
                        <span class="level_diff exp"> Expert</span>
                    </div>   
                </div>
            </div>
        </div>

        <div class="reviews_holder">
            <div class="prev_reviews">
                <h2> Previous Reviews </h2>

                <search class="search_bar">
                    <input type="text" placeholder="Search comments...">
                    <div class="select_holder">
                        <select class="diff_sel"> 
                            <option value="" disabled selected> Filter Comments</option>
                            <option value="Accurate"> Accurate </option>
                            <option value="Not Accurate"> Not Accurate </option>
                        </select> 
                    </div>
                </search>
            
                <div class="review_wrapper">
                    <div class="prev_review_instance">
                        <div class="user_info">
                            <img src="../style/assets/placeholders/pfp1.png" class="user_avatar">
                            <span class="user_skill"> 12950 </span>
                        </div>
                        <div class="review_content">
                            <div class="review_header">
                                <span class="username"> teslacia </span>
                                <span class="user_cc"> 13.4 </span>
                                <img src="../style/assets/icons/reco.png" class="recommendation_icon">
                            </div>
                            <p class="review_comment"> fun except the end lol, that superlong trill is insane </p>
                        </div>
                        <div class="review_actions">
                            <button class="see_full" onclick=openReview()>
                                <span> See full review </span>
                            </button>
                            <button class="like_button">
                                <img src="../style/assets/icons/heart.png" class="icon">
                                <span class="like_count">1.3k</span>
                            </button>
                        </div>
                    </div>
                    <dialog id="full_review">
                        <div class="review_dialog">
                            <div class="dialog_header">
                                <div class="avatar_group">
                                    <img class="user_avatar" id="dialog_avatar">
                                    <span class="user_skill" id="dialog_skill">  </span>
                                </div>
                                <span class="username" id="dialog_username">  </span>
                                <span class="user_cc" id="dialog_cc">  </span>
                                <img src="../style/assets/icons/reco.png" class="recommendation_icon">
                            </div>
                                    <p id="dialog_comment">  </p>

                                    <div class="review_attachment">
                                        
                                    </div>
                                    <div class="dialog_actions">
                                <button class="like_button">
                                        <img src="../style/assets/icons/heart.png" class="icon">
                                        <span class="like_count" id="dialog_likes">1.3k</span>
                                </button>
                                <button onclick=closeReview() class="exit"> Exit Review </button>    
                                </div>
                            
                            </div>
                    </dialog>
                </div>
            </div>

            <div class="user_review">
                <h2>My Review</h2>

            <div class="review_form">
                <div class="level_input_section">
                    <div class="reco_actions">
                        <input type="radio" id="acc" name="accuracy">
                        <label class ="accurate" for="acc"> Rated Accurately </label>

                        <input type ="radio" id="notacc" name="accuracy">
                        <label for="notacc" class ="not_accurate"> Not Rated Accurately </label>
                    </div>

                    <label for="level_rating">Level should be...</label>
                    <div class="slider_container">
                        <span class="range_label"> 11.5 </span>
                        <input type="range" min="11.5" max="15.0" value="13.7" class="level_range" id="level_rating" step="0.1">
                        <span class="range_label">15.0</span>
                    </div>
                </div>
                <div class="review_body">
                    <textarea class="review_text" placeholder="Write your review here..." rows="6"></textarea>
                    <input type="file" accept="video/*, image/jpeg, image/png, image/webp">
                </div>
                <div class="my_review_actions">
                    <button class="delete_btn">Delete</button>
                    <button class="submit_btn">Submit / Edit</button>
                </div>
            </div>
            </div>
            <!-- add this to the JS file or something lol -->
            <script>
                // just pass in the review obj in final 
                function openReview(){
                    // change data
                    document.getElementById("dialog_username").textContent = 'teslacia'; 
                    document.getElementById("dialog_avatar").src = '../style/assets/placeholders/pfp1.png'; 
                    document.getElementById("dialog_skill").textContent = '12950'; 
                    document.getElementById("dialog_cc").textContent = '13.4'; 
                    document.getElementById("dialog_comment").textContent = 'fun except the end lol, that superlong trill is insane'; 
                    document.getElementById("dialog_likes").textContent = '1.3k';

                    
                    // handling attachments
                    const attachmentContainer = document.querySelector('.review_attachment');
                    /* COMMENTED OUT -- UNCOMMENT WHEN YOU PASS IN REVIEWS. 
                    if (review.attachment){
                        if (review.attachment.type === 'video'){
                            attachmentContainer.innerHTML = '<video src = "{source}" controls> </video> '
                        }
                        else {
                            attachmentContainer.innerHTML = '<img src = "{source}" alt="Review attachment">'
                        }
                        attachmentContainer.style.display = 'block';
                    } 
                    else {
                        attachmentContainer.style.display = 'none';
                    } */

                    document.getElementById("full_review").showModal();
                }

                function closeReview(){
                    document.getElementById("full_review").close();
                }
            </script>
        </div>
</body>

</html>
