<!DOCTYPE html>

<html>

    <head>
        <link rel="stylesheet" href="/css/signup.css">
        <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
    </head>

    <body>
    <div class="parent">
        <div class="form">
            <a href="/" class = "back">
                <input type="submit" value="< Back">
            </a>
            <h1>Sign Up / Log In</h1>
            
            <form id="login_form">
                <p> Username </p>
                <input name="username" type="text" placeholder="Input username" required>
                <p> Email </p>
                <input name="email" type="email" placeholder="Input email" required>
                <p> Password </p>
                <input name="password" type="password" placeholder="Password" required>
                <p> Rating </p>
                <input name="rating" type="number" placeholder="Input maimai rating here" required>
                <p> Description (optional) </p>
                <textarea name="description" placeholder="This is the default bio!"></textarea>
                <br><br>
                <label for="remember"> Remember Me </label>
                <input name="rememberMe" id="remember" type="checkbox" class="remember_me"><br><br>
                <input type="submit" value="Sign Up" class="sign_button">
                <br><br>
                <input type="submit" value="Log In" class="log_button">
            </form>

        </div>
        </div>

        <script>
            const loginForm = document.getElementById("login_form");

            loginForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                const loginInfo = new FormData(loginForm);

                const clickedButton = event.submitter;
                const buttonClasses = clickedButton.classList;

                if (buttonClasses.contains("sign_button")) {
                    loginInfo.append("type", "signup");
                } else if (buttonClasses.contains("log_button")){
                    loginInfo.append("type", "login");
                }

                const response = await fetch("/submit_login", {
                    method: "POST",
                    body: loginInfo
                });

                if (!response.ok) {
                    const message = await response.text();
                    if (message) {
                        alert(message);
                    }
                    return;
                }

                window.location.href = response.url;
            });
        </script>
    </body>

</html>
